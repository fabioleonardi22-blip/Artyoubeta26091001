ipo==='Per Corso'&&(e.corsi||[]).includes(id)).reduce((a,e)=>a+cents(e.importo)/(e.corsi.length||1),0);const c=s.courses.find(c=>c.id===id);const teacherRefunds=s.refunds.filter(r=>r.docente===c?.docente).reduce((a,r)=>a+cents(r.importo)/Math.max(1,s.courses.filter(x=>x.docente===c.docente&&x.stato==='Pubblicato').length),0);return {incoming,outgoing:Math.round(expenses+teacherRefunds),net:incoming-Math.round(expenses+teacherRefunds)};}\n function schedule(s,e){const c=s.courses.find(c=>c.id===e.corso);if(!c)return [];let d=new Date(e.inizio+'T12:00:00Z');const end=new Date(c.fine+'T12:00:00Z');const out=[];const day=d.getUTCDate();const step=e.piano==='Annuale (3 rate)'?3:e.piano==='Annuale (1 rata)'?12:1;const amount=e.piano==='Annuale (3 rate)'?c.treRate:e.piano==='Annuale (1 rata)'?c.annuale:c.mensile;while(d<=end&&out.length<120){out.push({data:d.toISOString().slice(0,10),importo:amount});const month=d.getUTCMonth()+step;d=new Date(Date.UTC(d.getUTCFullYear(),month,1,12));d.setUTCDate(Math.min(day,new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()));if(e.piano==='Annuale (1 rata)'||e.piano==='Annuale (3 rate)'&&out.length===3)break;}return out;}\n function paymentReport(s,e,today){let budget=s.payments.filter(p=>p.iscrizione===e.id).reduce((a,p)=>a+cents(p.importo),0);const rows=schedule(s,e).map(r=>{const due=cents(r.importo);const paid=budget>=due;budget=Math.max(0,budget-due);return {...r,paid};});return {paid:rows.filter(r=>r.paid).length,total:rows.length,late:rows.filter(r=>!r.paid&&r.data<today).length,next:rows.find(r=>!r.paid)?.data||'Completato'};}\n function archive(s,label,cutoff){const before=JSON.parse(JSON.stringify(s));before.archives=[];const rec={id:uid(),nome:label,data:cutoff,snapshot:before};s.archives.push(rec);const closed=s.courses.filter(c=>c.fine<=cutoff).map(c=>c.id);s.courses=s.courses.filter(c=>!closed.includes(c.id));const en=s.enrollments.filter(e=>closed.includes(e.corso)).map(e=>e.id);s.enrollments=s.enrollments.filter(e=>!en.includes(e.id));s.payments=s.payments.filter(p=>p.data>cutoff&&!en.includes(p.iscrizione));s.lessons=s.lessons.filter(l=>!closed.includes(l.corso));s.attendance=s.attendance.filter(a=>s.lessons.some(l=>l.id===a.lezione));s.expenses=s.expenses.filter(e=>e.data>cutoff);s.refunds=s.refunds.filter(e=>e.data>cutoff);s.transfers=s.transfers.filter(e=>e.data>cutoff);s.memberships=s.memberships.filter(m=>s.campaigns.find(c=>c.id===m.campagna)?.fine>cutoff);return rec;}\n return {seed,cents,uid,save,balance,courseBalance,schedule,paymentReport,archive};\n})();\nif(typeof module!=='undefined')module.exports=ReplicaModel;\n<\/script><script>'use strict';\nconst M=ReplicaModel,$=id=>document.getElementById(id),key='artyou-replica-demo-v2';\nlet state;try{state=JSON.parse(localStorage.getItem(key));if(!state||!Array.isArray(state.users))state=M.seed();}catch{state=M.seed();}\nlet section='users',query='',sortKey='',ascending=true;\nconst names={users:'Utenti',memberships:'Tesserati',campaigns:'Campagne di tesseramento',courses:'Corsi',enrollments:'Iscrizioni',lessons:'Calendario corsi',attendance:'Presenze',payments:'Pagamenti corsi',expenses:'Spese',refunds:'Rimborsi docenti',transfers:'Trasferimenti docenti',finance:'Gestione finanziaria',communications:'Comunicazioni',reports:'Reportistica',archives:'Archivi anno sociale',audit:'Registro modifiche demo'};\nconst field=(name,label,type='text',options)=>({name,label,type,options});\nconst schemas={users:[field('nome','Nome completo'),field('email','Email','email'),field('ruolo','Ruolo','select',['Membro','Docente','Amministratore']),field('anno','Anno di corso'),field('telefono','Telefono','tel'),field('taglia','Taglia','select',['XS','S','M','L','XL','XXL'])],courses:[field('nome','Nome'),field('sede','Sede'),field('anno','Anno minimo','select',['','1','2','3','4','5']),field('posti','Capienza','number'),field('tessera','Richiede tessera associativa','checkbox'),field('descrizione','Descrizione','textarea'), s.some(e=>e.corso===r.id))||(kind==='campaigns'&&state.memberships.some(m=>m.campagna===r.id))||(kind==='enrollments'&&state.payments.some(p=>p.iscrizione===r.id));if(used){showPreview('Record collegato: rimuovi prima le relazioni oppure sospendi/chiudi il record.');return;}state[kind]=state[kind].filter(x=>x.id!==r.id);if(kind==='lessons')state.attendance=state.attendance.filter(x=>x.lezione!==r.id);state.audit.push({data:new Date().toISOString(),azione:'rimozione demo',tipo:kind,id:r.id});persist();render();}\nfunction edit(kind,record={}){$('editor-title').textContent=`${record.id?'Modifica':'Aggiungi'} · ${names[kind]}`;$('fields').replaceChildren();$('form-error').textContent='';for(const f of schemas[kind]){const label=el('label',f.label);label.htmlFor='f-'+f.name;const select=f.type==='select'||state[f.type]||f.type==='multi-courses';const input=el(select?'select':f.type==='textarea'?'textarea':'input');input.id='f-'+f.name;input.name=f.name;if(select){if(f.type==='multi-courses')input.multiple=true;const opts=f.options||state[f.type==='multi-courses'?'courses':f.type].filter(r=>f.name!=='docente'||r.ruolo==='Docente').map(r=>({id:r.id,name:ref(f.type==='multi-courses'?'courses':f.type,r.id)}));for(const opt of opts){const o=el('option',typeof opt==='string'?opt:opt.name);o.value=typeof opt==='string'?opt:opt.id;o.selected=Array.isArray(record[f.name])?record[f.name].includes(o.value):String(record[f.name]??'')===o.value;input.append(o);}}else{input.type=f.type==='textarea'?undefined:f.type;if(f.type==='checkbox')input.checked=Boolean(record[f.name]);else input.value=record[f.name]??(f.type==='date'?new Date().toISOString().slice(0,10):'');if(f.type==='number'){input.min='0';input.step=f.name==='posti'?'1':'0.01';}}input.required=!['checkbox','multi-courses'].includes(f.type)&&!['anno','telefono','taglia','note','giorni'].includes(f.name);$('fields').append(label,input);}\n $('edit-form').onsubmit=event=>{event.preventDefault();try{const r={...record};for(con ered.length)table.append(el('caption','Nessun record.'));wrap.append(table);return wrap;}\nfunction finance(){const b=M.balance(state);const p=el('p',`Bilancio generale demo: entrate ${(b.incoming/100).toFixed(2)} € · spese generali ${(b.outgoing/100).toFixed(2)} € · saldo ${(b.net/100).toFixed(2)} €`);$('view').append(p,el('p','Le spese per corso sono ripartite tra i corsi selezionati. I rimborsi aggiuntivi del docente sono ripartiti sui suoi corsi pubblicati nella demo.'));const rows=state.courses.map(c=>{const v=M.courseBalance(state,c.id);return {corso:c.nome,entrate:(v.incoming/100).toFixed(2),uscite:(v.outgoing/100).toFixed(2),saldo:(v.net/100).toFixed(2)};});$('view').append(table(rows));button('Esporta bilancio CSV',()=>exportCSV(rows,'bilancio-demo.csv'),$('toolbar'));}\nfunction reports(){const today=new Date().toISOString().slice(0,10);const rows=state.enrollments.map(e=>{const r=M.paymentReport(state,e,today);return {utente:ref('users',e.utente),corso:ref('courses',e.corso),piano:e.piano,rate:r.paid+'/'+r.total,prossima:r.next,inRitardo:r.late,sospesa:e.sospesa};});$('view').append(el('h3','Scadenze iscrizioni'),table(rows));button('Esporta scadenze CSV',()=>exportCSV(rows,'scadenze-demo.csv'),$('toolbar'));const teacherRows=state.courses.map(c=>{const en=state.enrollments.filter(e=>e.corso===c.id);const lessons=state.lessons.filter(l=>l.corso===c.id&&l.data<=today);const counts=lessons.map(l=>state.attendance.filter(a=>a.lezione===l.id&&a.presente).length);return {docente:ref('users',c.docente),corso:c.nome,sede:c.sede,iscritti:en.filter(e=>!e.sospesa).length,sospesi:en.filter(e=>e.sospesa).length,lezioni:lessons.length,presenzaMedia:counts.length?(counts.reduce((a,b)=>a+b,0)/counts.length).toFixed(1):'0'};});$('view').append(el('h3','Statistiche docenti'),table(teacherRows));button('Esporta docenti CSV',()=>exportCSV(teacherRows,'docenti-demo.csv'),$('toolbar'));}\nfunction attendance(){const select=el('select');select.setAttribute('aria-label','Lezione');for(const l of state.lessons){const o=el('option',`${ref('courses',l.corso)} · ${l.data}`);o.value=l.id;select.append(o);}const rows=el('div');const draw=()=>{rows.replaceChildren();const lesson=state.lessons.find(l=>l.id===select.value);if(!lesson){rows.append(el('p','Aggiungi prima una lezione.'));return;}for(const e of state.enrollments.filter(e=>e.corso===lesson.corso&&!e.sospesa)){const label=el('label',ref('users',e.utente));const box=el('input');box.type='checkbox';box.checked=Boolean(state.attendance.find(a=>a.lezione===lesson.id&&a.iscrizione===e.id)?.presente);box.addEventListener('change',()=>{let r=state.attendance.find(a=>a.lezione===lesson.id&&a.iscrizione===e.id);if(!r){r={id:M.uid(),lezione:lesson.id,iscrizione:e.id};state.attendance.push(r);}r.presente=box.checked;persist();});label.prepend(box);rows.append(label);}};select.addEventListener('change',draw);$('view').append(select,rows);draw();}\nfunction communications(){const form=el('form');const subject=el('input');subject.required=true;subject.placeholder='Titolo';subject.setAttribute('aria-label','Titolo comunicazione');const body=el('textarea');body.required=true;body.setAttribute('aria-label','Corpo comunicazione');form.append(el('label','Titolo'),subject,el('label','Corpo'),body);const filters={};for(const [id,label] of [['all','Tutti gli account'],['active','Tesserati attivi'],['teachers','Tutti i docenti'],['course','Partecipanti a un corso'],['self','Copia a me stesso']]){const lab=el('label',label),box=el('input');box.type='checkbox';filters[id]=box;lab.prepend(box);form.append(lab);}const course=el('select');course.setAttribute('aria-label','Corso destinatari');state.courses.forEach(c=>{const o=el('option',c.nome);o.value=c.id;course.append(o);});form.append(course);const recipients=()=>state.users.filter(u=>filters.all.checked||filters.teachers.checked&&u.ruolo==='Docente'||filters.active.checked&&state.memberships.some(m=>m.utente===u.id&&m.stato==='Attiva'&&state.campaigns.some(c= <\/tbody><\/table><\/div><\/section><section id=\"iscrizioni\"><h2>Iscrizioni studenti<\/h2><label for=\"search\">Cerca studente<\/label><input id=\"search\" type=\"search\" placeholder=\"Nome studente\"><div class=\"table\"><table><thead><tr><th>Studente<\/th><th>Piano<\/th><th>Importo<\/th><th>Stato<\/th><th>Dettagli<\/th><\/tr><\/thead><tbody id=\"students\"><\/tbody><\/table><\/div><\/section><section id=\"pagamenti\"><h2>Pagamenti<\/h2><p>La demo mostra piani mensili, annuali e in tre rate. Scadenze e storico effettivi richiedono il backend.<\/p><p>La dicitura “Pagato” si riferisce alla rata registrata, non necessariamente all’intero anno.<\/p><\/section><section id=\"rendiconto\"><h2>Rendiconto docente<\/h2><div class=\"stats\"><article><strong>75 €<\/strong>Incassi demo<\/article><article><strong>70 €<\/strong>Rimborso lezione demo<\/article><article><strong>5 €<\/strong>Saldo demo<\/article><\/div><p>Saldo positivo: somme da restituire all’amministrazione. Saldo negativo: somme da ricevere.<\/p><\/section><section id=\"profilo\"><h2>Profilo docente<\/h2><p>Docente dimostrativo · Ruolo: docente<\/p><p>Accesso, modifica del profilo e autorizzazioni server ancora da integrare.<\/p><\/section><\/main><\/div><dialog id=\"detail\"><h2>Dettaglio iscrizione<\/h2><p id=\"detail-text\"><\/p><button id=\"close-detail\">Chiudi<\/button><\/dialog><script>'use strict';\nconst students = Array.from({length:6},(_,i)=>({name:`Studente demo ${i+1}`,plan:['Mensile','Annuale (1 rata)','Annuale (3 rate)'][i%3],amount:[75,570,195][i%3],paid:true}));\nconst dates=['2026-10-01','2026-10-08','2026-10-15','2026-10-22','2026-10-29'];\nconst presence=new Map();\nconst $=id=>document.getElementById(id);\nfunction readable(date){return new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(`${date}T12:00:00`));}\nfunction renderDates(){const chosen=$('lesson').value;$('dates').replaceChildren();$('lesson').replaceChildren();dates.sort().forEach(date=>{const item=document.createElement('span');item.textContent=readable(date);$('dates').append(item);const option=document.createElement('option');option.value=date;option.textContent=readable(date);$('lesson').append(option);});if(dates.includes(chosen))$('lesson').value=chosen;renderAttendance();}\nfunction renderAttendance(){$('attendance').replaceChildren();const date=$('lesson').value;students.forEach((student,i)=>{const row=document.createElement('tr');const name=document.createElement('td');name.textContent=student.name;const cell=document.createElement('td');const check=document.createElement('input');check.type='checkbox';check.setAttribute('aria-label',`Presente: ${student.name}, ${readable(date)}`);check.checked=presence.get(`${date}/${i}`)||false;check.addEventListener('change',()=>presence.set(`${date}/${i}`,check.checked));cell.append(check);row.append(name,cell);$('attendance').append(row);});}\nfunction renderStudents(){$('students').replaceChildren();students.filter(s=>s.name.toLowerCase().includes($('search').value.toLowerCase())).forEach(student=>{const row=document.createElement('tr');[student.name,student.plan,`${student.amount} €`,'Pagato (demo)'].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.append(cell);});const cell=document.createElement('td');const button=document.createElement('button');button.textContent='Dettagli';button.setAttribute('aria-label',`Dettagli di ${student.name}`);button.addEventListener('click',()=>{$('detail-text').textContent=`${student.name} · ${student.plan} · ${student.amount} €. Dati dimostrativi; scadenze e storico non collegati.`;$('detail').showModal();});cell.append(button);row.append(cell);$('students').append(row);});}\n$('date-form').addEventListener('submit',event=>{event.preventDefault();const date=$('new-date').value;if(dates.includes(date)){$('date-status').textContent='Questa data è già presente.';return;}dates.push(date);renderDates();$('lesson').value=date;renderAttendance();$('date-status').textContent='Data aggiunta alla demo.';});$('lesson').addEventListener('change',renderAttendance);$('search').addEventListener('input',renderStudents);$('close-detail').addEventListener('click',()=>$('detail').close());renderDates();renderStudents();\n<\/script><\/body><\/html>\n", "allievo": "<!doctype html><html lang=\"it\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Area allievo · Replica Artyou<\/title><meta name=\"description\" content=\"Demo dell’area allievo con corsi, tesseramento e rate.\"><meta name=\"robots\" content=\"noindex,follow\"><style>:root{font-family:Arial,Helvetica,sans-serif;color:#192327;background:#ece7de;scroll-behavior:smooth}*{box-sizing:border-box}body{margin:0}header{background:#192327;border-top:5px solid #e83832;color:white;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}header img{object-fit:contain}.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;padding:32px 20px}nav{display:flex;flex-direction:column;gap:8px;align-self:start;position:sticky;top:20px}nav a{padding:13px;border-radius:10px;background:white;color:#192327;text-decoration:none}nav a:hover,nav a:focus-visible{background:#fff0a4}h1{font-size:clamp(28px,4vw,42px);margin-top:20px}h2{font-size:24px}section{scroll-margin-top:20px;margin:32px 0;padding:24px;background:#fff;border-radius:16px}.notice{padding:14px;border-left:4px solid #dfad00;background:#fff7d7;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stats article{background:#192327;color:white;padding:22px;border-radius:14px;display:flex;flex-direction:column;gap:9px}.stats strong{font-size:30px}.button,button{display:inline-block;border:0;border-radius:8px;background:#f6d445;color:#192327;padding:12px 18px;font-weight:bold;cursor:pointer;text-decoration:none}button:hover{background:#e8c330}input,s font-size:14px;text-decoration:none;border:1px solid #ffffff45;padding:10px 14px;border-radius:8px}h1,h2,h3{font-family:'Bricolage Grotesque',Georgia,sans-serif;letter-spacing:-.035em}h1{font-size:clamp(30px,4vw,44px)}h2{font-size:26px}h3{font-size:21px}.layout{gap:24px;padding:28px 24px}main{min-width:0}section{border:1px solid #e8e1d4;box-shadow:0 5px 20px #2c1f0808}nav a{border:1px solid #e8e1d4;font-size:15px}nav a:hover,nav a[aria-current=page]{background:#f4d142;color:#202020}.button,button{background:#176843;color:white;font:600 14px 'Instrument Sans',Helvetica,Arial,sans-serif;min-height:42px}.button:hover,button:hover{background:#105234}button:disabled{background:#e5e5e5;color:#555;cursor:not-allowed}th button{color:#202020;background:transparent}th button:hover{background:#f4f0e7}.stats article{background:#202020;border-top:4px solid #e83832}.notice{font-size:14px;background:#fff5d6;border-color:#c79a2b}#corsi article{padding:20px 0;border-bottom:1px solid #e8e1d4}#corsi article:last-child{border-bottom:0}p{line-height:1.6}input,select,textarea{min-height:42px}#profile-form input,#profile-form select{width:100%}@media(max-width:700px){:root{background:#faf8f3}body{box-shadow:none}header{padding:14px 16px;gap:10px}header img{width:130px;height:44px}header a{font-size:13px;padding:9px}.layout{padding:18px 12px;gap:10px}nav a{font-size:14px}section{padding:16px;margin:20px 0}.stats{grid-template-columns:1fr}h1{overflow-wrap:anywhere}}\n<\/style><\/head><body><header><strong>Artyou · Area allievo<\/strong><\/header><div class=\"layout\"><nav aria-label=\"Area allievo\"><a href=\"#catalogo\">Elenco corsi<\/a><a href=\"#tessera\">Tesseramento<\/a><a href=\"#iscrizioni\">Miei corsi e rate<\/a><a href=\"#calendario\">Calendario<\/a><a href=\"#profilo\">Profilo<\/a><\/nav><main><h1>Benvenuto, socio demo<\/h1><p class=\"notice\">Dati fittizi condivisi con l’amministrazione di questo browser. Nessun pagamento reale. Calendario, rate e profilo sono una proposta da verificare rispetto all’originale.<\/p><p id=\"status\" role=\"status\"><\/p><section id=\"catalogo\"><h2>Elenco corsi<\/h2><label for=\"anno\">Categoria<\/label><select id=\"anno\"><option value=\"\">Tutti<\/option><option value=\"speciali\">Workshop e Festival<\/option><option value=\"1\">1° anno<\/option><option value=\"2\">2° anno<\/option><option value=\"3\">3° anno<\/option><option value=\"post\">Post Triennio<\/option><\/select><div id=\"corsi\"><\/div><\/section><section id=\"tessera\"><h2>Tesseramento<\/h2><div id=\"campagne\"><\/div><\/section><section id=\"iscrizioni\"><h2>Miei corsi e rate<\/h2><div id=\"miei\"><\/div><\/section><section id=\"calendario\"><h2>Calendario delle mie lezioni<\/h2><div id=\"lezioni\"><\/div><\/section><section id=\"profilo\"><h2>Profilo<\/h2><form id=\"profile-form\"><label for=\"nome\">Nome completo<\/label><input id=\"nome\" required><label for=\"telefono\">Telefono<\/label><input id=\"telefono\" type=\"tel\"><label for=\"taglia\">Taglia<\/label><select id=\"taglia\"><option>XS<\/option><option>S<\/option><option>M<\/option><option>L<\/option><option>XL<\/option><option>XXL<\/option><\/select><p><button>Salva profilo demo<\/button><\/p><\/form><\/section><\/main><\/div><script>'use strict';\nconst ReplicaModel=(()=>{\n const seed=()=>({users:[{id:'u1',nome:'Socio Demo',email:'socio@example.test',ruolo:'Membro',anno:'1',telefono:'',taglia:'M'},{id:'u2',nome:'Docente Demo',email:'docente@example.test',ruolo:'Docente',anno:'',telefono:'',taglia:'M'}],courses:[{id:'c1',nome:'Improvvisazione primo anno',sede:'Sede dimostrativa',anno:'1',posti:15,tessera:true,descrizione:'Corso dimostrativo',inizio:'2026-10-01',fine:'2027-06-30',orario:'21:00',mensile:75,treRate:195,annuale:570,giorni:'Gio',stato:'Pubblicato',docente:'u2'}],campaigns:[{id:'ca1',nome:'Tesseramento demo 2026/2027',descrizione:'Campagna dimostrativa',importo:30,valuta:'EUR',inizio:'2026-09-01',fine:'2027-08-31',stato:'Pubblicata'}],memberships:[],enrollments:[{id:'e1',utente:'u1',corso:'c1',piano:'Mensile',inizio:'2026-10-01',sospesa:false}],lessons:[{id:'l1',corso:'c1',data:'2026-10-01'}],attendance:[],payments:[],expenses:[],refunds:[],transfers:[],drafts:[],archives:[],audit:[]});\n const cents=n=>Math.round(Number(n)*100);\n const uid=()=>crypto.randomUUID();\n function validate(kind,r,s){if(kind==='courses'){if(!Number.isInteger(Number(r.posti))||Number(r.posti)<1)throw Error('Capienza non valida');if(r.fine<r.inizio)throw Error('Fine antecedente all’inizio');}if(['payments','expenses','refunds','transfers'].includes(kind)&&(!Number.isFinite(Number(r.importo))||Number(r.importo)<=0))throw Error('Importo deve essere positivo');if(kind==='campaigns'&&Number(r.importo)<0)throw Error('Importo negativo');if(kind==='memberships'){if(!s.users.some(u=>u.id===r.utente)||!s.campaigns.some(c=>c.id===r.campagna))throw Error('Utente o campagna non validi');if(s.memberships.some(x=>x.id!==r.id&&x.utente===r.utente&&x.campagna===r.campagna))throw Error('Tessera già assegnata');}if(kind==='enrollments'){const c=s.courses.find(x=>x.id===r.corso);if(!c||!s.users.some(u=>u.id===r.utente))throw Error('Corso o utente non valido');if(s.enrollments.some(e=>e.id!==r.id&&e.utente===r.utente&&e.corso===r.corso))throw Error('Iscrizione già presente');if(s.enrollments.filter(e=>e.id!==r.id&&e.corso===r.corso&&!e.sospesa).length>=Number(c.posti)&&!r.sospesa)throw Error('Corso completo');if(c.tessera&&!s.memberships.some(m=>m.utente===r.utente&&m.stato==='Attiva'&&s.campaigns.some(a=>a.id===m.campagna&&a.inizio<=r.inizio&&a.fine>=r.inizio)))throw Error('Serve tessera attiva alla data di iscrizione');}if(kind==='lessons'){const c=s.courses.find(c=>c.id===r.corso);if(!c||r.data<c.inizio||r.data>c.fine)throw Error('Data fuori dal periodo del corso');if(s.lessons.some(l=>l.id!==r.id&&l.corso===r.corso&&l.data===r.data))throw Error('Lezione già presente');}if(kind==='payments'&&!s.enrollments.some(e=>e.id===r.iscrizione))throw Error('Iscrizione non valida');}\n function save(s,kind,r){validate(kind,r,s);const i=s[kind].findIndex(x=>x.id===r.id);const value={...r,id:r.id||uid()};if(i<0)s[kind].push(value);else s[kind][i]=value;s.audit.push({data:new Date().toISOString(),azione:i<0?'creazione':'modifica',tipo:kind,id:value.id});return value;}\n function balance(s){const incoming=s.payments.reduce((a,p)=>a+cents(p.importo),0)+s.memberships.reduce((a,m)=>a+cents(s.campaigns.find(c=>c.id===m.campagna)?.importo||0),0);const outgoing=s.expenses.filter(e=>e.tipo==='Generale').reduce((a,e)=>a+cents(e.importo),0);return {incoming,outgoing,net:incoming-outgoing};}\n function courseBalance(s,id){const incoming=s.payments.filter(p=>s.enrollments.some(e=>e.id===p.iscrizione&&e.corso===id)).reduce((a,p)=>a+cents(p.importo),0);const expenses=s.expenses.filter(e=>e.tipo==='Per Corso'&&(e.corsi||[]).includes(id)).reduce((a,e)=>a+cents(e.importo)/(e.corsi.length||1),0);const c=s.courses.find(c=>c.id===id);const teacherRefunds=s.refunds.filter(r=>r.docente===c?.docente).reduce((a,r)=>a+cents(r.importo)/Math.max(1,s.courses.filter(x=>x.docente===c.docente&&x.stato==='Pubblicato').length),0);return {incoming,outgoing:Math.round(expenses+teacherRefunds),net:incoming-Math.round(expenses+teacherRefunds)};}\n function schedule(s,e){const c=s.courses.find(c=>c.id===e.corso);if(!c)return [];let d=new Date(e.inizio+'T12:00:00Z');const end=new Date(c.fine+'T12:00:00Z');const out=[];const day=d.getUTCDate();const step=e.piano==='Annuale (3 rate)'?3:e.piano==='Annuale (1 rata)'?12:1;const amount=e.piano==='Annuale (3 rate)'?c.treRate:e.piano==='Annuale (1 rata)'?c.annuale:c.mensile;while(d<=end&&out.length<120){out.push({data:d.toISOString().slice(0,10),importo:amount});const month=d.getUTCMonth()+step;d=new Date(Date.UTC(d.getUTCFullYear(),month,1,12));d.setUTCDate(Math.min(day,new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate()));if(e.piano==='Annuale (1 rata)'||e.piano==='Annuale (3 rate)'&&out.length===3)break;}return out;}\n function paymentReport(s,e,today){let budget=s.payments.filter(p=>p.iscrizione===e.id).reduce((a,p)=>a+cents(p.importo),0);const rows=schedule(s,e).map(r=>{const due=cents(r.importo);const paid=budget>=due;budget=Math.max(0,budget-due);return {...r,paid};});return {paid:rows.filter(r=>r.paid).length,total:rows.length,late:rows.filter(r=>!r.paid&&r.data<today).length,next:rows.find(r=>!r.paid)?.data||'Completato'};}\n function archive(s,label,cutoff){const before=JSON.parse(JSON.stringify(s));before.archives=[];const rec={id:uid(),nome:label,data:cutoff,snapshot:before};s.archives.push(rec);const closed=s.courses.filter(c=>c.fine<=cutoff).map(c=>c.id);s.courses=s.courses.filter(c=>!closed.includes(c.id));const en=s.enrollments.filter(e=>closed.includes(e.corso)).map(e=>e.id);s.enrollments=s.enrollments.filter(e=>!en.includes(e.id));s.payments=s.payments.filter(p=>p.data>cutoff&&!en.includes(p.iscrizione));s.lessons=s.lessons.filter(l=>!closed.includes(l.corso));s.attendance=s.attendance.filter(a=>s.lessons.some(l=>l.id===a.lezione));s.expenses=s.expenses.filter(e=>e.data>cutoff);s.refunds=s.refunds.filter(e=>e.data>cutoff);s.transfers=s.transfers.filter(e=>e.data>cutoff);s.memberships=s.memberships.filter(m=>s.campaigns.find(c=>c.id===m.campagna)?.fine>cutoff);return rec;}\n return {seed,cents,uid,save,balance,courseBalance,schedule,paymentReport,archive};\n})();\nif(typeof module!=='undefined')module.exports=ReplicaModel;\n<\/script><script>'use strict';\nconst M=ReplicaModel,key='artyou-replica-demo-v2',$=id=>document.getElementById(id);\nlet state;try{state=JSON.parse(localStorage.getItem(key));if(!state?.users)state=M.seed();}catch{state=M.seed();}\nconst user=state.users.find(u=>u.ruolo==='Membro');\nconst today=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'});\nconst euro=n=>Number(n).toLocaleString('it-IT',{style:'currency',currency:'EUR'});\nfunction node(tag,text,parent){const e=document.createElement(tag);e.textContent=text;parent.append(e);return e;}\nfunction action(text,parent,fn,disabled=false){const b=node('button',text,parent);b.type='button';b.disabled=disabled;b.addEventListener('click',()=>{try{fn();localStorage.setItem(key,JSON.stringify(state));render();$('status').textContent='Modifica salvata nella demo.';}catch(e){$('status').textContent=e.message;}});return b;}\nfunction active(){return state.memberships.some(m=>m.utente===user.id&&m.stato==='Attiva'&&state.campaigns.some(c=>c.id===m.campagna&&c.inizio<=today()&&c.fine>=today()));}\nfunction render(){if(!user){$('status').textContent='Crea un utente Membro nell’amministrazione demo.';return;}for(const id of ['corsi','campagne','miei','lezioni'])$(id).replaceChildren();\n const category=$('anno').value;\n for(const c of state.courses.filter(c=>c.stato==='Pubblicato'&&(!category||(category==='post'?Number(c.anno)>3:category==='speciali'?!c.anno:c.anno===category)))){const box=node('article','',$('corsi'));node('h3',c.nome,box);node('p',`${c.sede} · ${c.giorni} ${c.orario} · ${c.inizio} – ${c.fine}`,box);node('p',`Docente: ${state.users.find(u=>u.id===c.docente)?.nome||'Da assegnare'}`,box);const seats=Number(c.posti)-state.enrollments.filter(e=>e.corso===c.id&&!e.sospesa).length;node('p',`${Math.max(0,seats)} posti disponibili`,box);node('p',`${euro(c.mensile)} al mese · ${euro(c.treRate)} per ciascuna delle 3 rate · ${euro(c.annuale)} unica rata`,box);const enrolled=state.enrollments.some(e=>e.utente===user.id&&e.corso===c.id);const blocked=c.tessera&&!active();if(enrolled)node('p','Già iscritto',box);else if(blocked)node('p','Richiede tessera attiva',box);else{const label=node('label','Formula di iscrizione',box);const select=node('select','',label);for(const p of ['Mensile','Annuale (3 rate)','Annuale (1 rata)'])node('option',p,select);action('Iscriviti nella demo',box,()=>M.save(state,'enrollments',{utente:user.id,corso:c.id,piano:select.value,inizio:today()>c.inizio?today():c.inizio,sospesa:false}),seats<=0||today()>c.fine);}}\n if(!$('corsi').children.length)node('p','Nessun corso pubblicato in questa categoria.',$('corsi'));\n for(const c of state.campaigns.filter(c=>c.stato==='Pubblicata'&&c.inizio<=today()&&c.fine>=today())){node('h3',c.nome,$('campagne'));node('p',`${euro(c.importo)} · ${c.inizio} – ${c.fine}`,$('campagne'));const exists=state.memberships.some(m=>m.utente===user.id&&m.campagna===c.id);action(exists?'Tessera assegnata':'Attiva tessera nella demo',$('campagne'),()=>M.save(state,'memberships',{utente:user.id,campagna:c.id,stato:'Attiva',numero:'DEMO-'+Date.now()}),exists);}\n const mine=state.enrollments.filter(e=>e.utente===user.id);\n if(!mine.length)node('p','Nessuna iscrizione.',$('miei'));\n for(const e of mine){const c=state.courses.find(c=>c.id===e.corso);node('h3',c?.nome||'Corso archiviato',$('miei'));const r=M.paymentReport(state,e,today());node('p',`${e.piano} · ${e.sospesa?'Sospesa':'Attiva'} · ${r.paid}/${r.total} rate saldate · ${r.late} scadute · prossima: ${r.next}`,$('miei'));for(const rate of M.schedule(state,e))node('p',`${rate.data} · ${euro(rate.importo)}`,$('miei'));node('p','I pagamenti vengono registrati dall’amministrazione demo; nessun addebito online.',$('miei'));}\n for(const l of state.lessons.filter(l=>mine.some(e=>e.corso===l.corso)).sort((a,b)=>a.data.localeCompare(b.data)))node('p',`${l.data} · ${state.courses.find(c=>c.id===l.corso)?.nome||''}`,$('lezioni'));\n if(!$('lezioni').children.length)node('p','Nessuna lezione programmata.',$('lezioni'));\n $('nome').value=user.nome;$('telefono').value=user.telefono||'';$('taglia').value=user.taglia||'M';}\n$('anno').addEventListener('change',render);\n$('profile-form').addEventListener('submit',e=>{e.preventDefault();try{M.save(state,'users',{...user,nome:$('nome').value.trim(),telefono:$('telefono').value.trim(),taglia:$('taglia').value});Object.assign(user,state.users.find(u=>u.id===user.id));localStorage.setItem(key,JSON.stringify(state));$('status').textContent='Profilo demo salvato.';}catch(err){$('status').textContent=err.message;}});\nwindow.addEventListener('storage',()=>location.reload());render();\n<\/script><\/body><\/html>\n"};const frame=document.getElementById('demo');function show(k){frame.srcdoc=pages[k];}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.page));show('admin');</script></html>
