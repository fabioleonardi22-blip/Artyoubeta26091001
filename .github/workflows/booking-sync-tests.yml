name: Booking sync isolated tests
on:
  pull_request:
    paths:
      - "api/artyou.js"
      - "tests/booking-sync.test.js"
      - ".github/workflows/booking-sync-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/booking-sync.test.js
