name: Backup MySQL

# Audit 10/10/2026 (A8): backup giornaliero cifrato dei database Railway, conservato fuori da Railway
# (artifact GitHub, 30 giorni), con prova di ripristino in un MySQL temporaneo a ogni esecuzione.
# Segreti richiesti (Settings > Secrets and variables > Actions):
#   BACKUP_PASSPHRASE   frase di almeno 24 caratteri, da custodire anche fuori da GitHub
#   BACKUP_DB_MAIN_URL  mysql://utente_backup:password@host:porta/database  (database del sito)
#   BACKUP_DB_MERCH_URL mysql://... (database del merchandising; facoltativo)
# Usare un utente MySQL con soli permessi SELECT, SHOW VIEW, TRIGGER, EVENT, LOCK TABLES.
on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:
  pull_request:
    paths: ["scripts/backup/**", ".github/workflows/mysql-backup.yml"]

permissions:
  contents: read

concurrency:
  group: mysql-backup
  cancel-in-progress: false

jobs:
  selftest:
    # Prova degli script su un database di esempio: nessun segreto, nessun dato reale.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:9
        env: { MYSQL_ROOT_PASSWORD: test-root-pw, MYSQL_DATABASE: esempio }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -ptest-root-pw" --health-interval=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Dati di esempio
        run: |
          docker run --rm --network host -e MYSQL_PWD=test-root-pw mysql:9 mysql -h127.0.0.1 -uroot esempio \
            -e "CREATE TABLE events(id INT PRIMARY KEY, title VARCHAR(50)); INSERT INTO events VALUES (1,'ShortYou'),(2,'Vortice'); CREATE TABLE bookings(id INT PRIMARY KEY, event_id INT); INSERT INTO bookings VALUES (1,1),(2,1),(3,2);"
      - name: Backup e prova di ripristino
        env:
          DB_URL: mysql://root:test-root-pw@127.0.0.1:3306/esempio
          BACKUP_PASSPHRASE: prova-solo-per-il-test-automatico
          MYSQL_DOCKER_ARGS: --network host
        run: |
          scripts/backup/mysql-backup.sh esempio out
          scripts/backup/mysql-restore-check.sh out/esempio-*.sql.gz.enc out/esempio-*.counts.tsv

  backup:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [main, merch]
    steps:
      - uses: actions/checkout@v4
      - name: Backup cifrato e prova di ripristino
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          DB_URL: ${{ matrix.db == 'main' && secrets.BACKUP_DB_MAIN_URL || secrets.BACKUP_DB_MERCH_URL }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then echo "::warning::Segreti per ${{ matrix.db }} non configurati: backup saltato"; exit 0; fi
          scripts/backup/mysql-backup.sh "${{ matrix.db }}" out
          scripts/backup/mysql-restore-check.sh out/*.sql.gz.enc out/*.counts.tsv
      - name: Conserva il backup (cifrato)
        if: success() && hashFiles('out/*.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: mysql-${{ matrix.db }}-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore
