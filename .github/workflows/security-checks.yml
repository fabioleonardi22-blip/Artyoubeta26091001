name: Security checks

# Evita di lanciare un nuovo controllo ad ogni piccolo commit su main.
# I controlli partono sui PR, ogni notte e manualmente quando serve.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Scan repository for obvious secrets
        run: node scripts/security-scan.mjs

      - name: Install production dependencies safely
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
