name: Security checks

# Evita di lanciare un nuovo controllo ad ogni piccolo commit su main.
# I controlli partono sui PR, ogni notte e manualmente quando serve.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Scan repository for obvious secrets
        run: node scripts/security-scan.mjs

      - name: Install production dependencies safely
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  tests:
    # Test completi, compresi quelli delle prenotazioni simultanee su un MySQL di prova
    # della stessa serie di produzione. Nessun segreto, nessun dato reale.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:9
        env: { MYSQL_ROOT_PASSWORD: test-root-pw, MYSQL_DATABASE: artyou_test }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -ptest-root-pw" --health-interval=5s --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Schema di prova
        run: docker run --rm --network host -i -e MYSQL_PWD=test-root-pw mysql:9 mysql -h127.0.0.1 -uroot artyou_test < database/schema.sql

      - name: Test
        run: |
          export MYSQL_TEST_URL="mysql""://root:test-root-pw@127.0.0.1:3306/artyou_test"
          npm test
