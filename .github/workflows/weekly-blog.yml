name: Weekly blog - La finestra sul cortile
on:
  workflow_dispatch:
    inputs:
      rubrica:
        description: "Rubrica (vuoto = automatica)"
        required: false
        default: ""
        type: choice
        options: ["", "Festival Radar", "Improv around the world", "Impro People", "Dentro l'improv"]
  schedule:
    # lunedì: Festival Radar · giovedì: le altre rubriche a rotazione
    - cron: "15 8 * * 1"
    - cron: "15 8 * * 4"
    # tentativi di riserva nello stesso giorno: partono solo se alle 8 non è uscito nulla
    - cron: "15 13 * * 1"
    - cron: "15 13 * * 4"
    - cron: "15 18 * * 1"
    - cron: "15 18 * * 4"

permissions:
  contents: write

concurrency:
  group: blog-finestra-sul-cortile
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Genera articolo con Gemini + fallback OpenRouter (con foto Unsplash)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          RUBRICA: ${{ github.event.inputs.rubrica }}
        # fino a 3 tentativi, a 5 minuti di distanza, se un servizio non risponde
        run: |
          for i in 1 2 3; do
            if node scripts/generate-blog.mjs; then exit 0; fi
            echo "Tentativo $i non riuscito"; git checkout -- . ; git clean -fdq la-finestra-sul-cortile/
            [ $i -lt 3 ] && sleep 300
          done
          exit 1
      - name: Foto per gli articoli che non ce l'hanno
        if: always()
        continue-on-error: true
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/blog-images.mjs
      - name: Commit se ci sono novità
        if: always()
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git config user.name "Artyou Blog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/articles.json la-finestra-sul-cortile/
          git commit -m "blog: articolo settimanale La finestra sul cortile"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            echo "Push non riuscito, riprovo"; sleep 20
          done
          exit 1
