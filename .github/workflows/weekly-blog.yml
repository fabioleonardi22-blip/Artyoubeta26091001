name: Weekly blog - La finestra sul cortile
on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * 3"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Genera articolo con Gemini + fallback OpenRouter (con foto Unsplash)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/generate-blog.mjs
      - name: Foto per gli articoli che non ce l'hanno
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/blog-images.mjs
      - name: Commit se ci sono novità
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git config user.name "Artyou Blog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/articles.json la-finestra-sul-cortile/
          git commit -m "blog: articolo settimanale La finestra sul cortile"
          git push
