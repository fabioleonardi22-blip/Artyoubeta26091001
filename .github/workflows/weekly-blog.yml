name: Weekly blog - La finestra sul cortile
on:
  workflow_dispatch:
  push:
    branches:
      - blog-finestra-sul-cortile
    paths:
      - ".github/workflows/weekly-blog.yml"
      - "scripts/generate-blog.mjs"
      - "blog/sources.json"
  schedule:
    - cron: "15 8 * * 3"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Genera articolo con OpenRouter Free
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/generate-blog.mjs
      - name: Commit se ci sono novità
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git config user.name "Artyou Blog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/articles.json la-finestra-sul-cortile/
          git commit -m "blog: articolo settimanale La finestra sul cortile"
          git push
