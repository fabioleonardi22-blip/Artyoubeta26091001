name: CodeQL

# CodeQL è più pesante: niente esecuzione ad ogni push.
# Viene eseguito sui PR, settimanalmente e a richiesta.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "25 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3
