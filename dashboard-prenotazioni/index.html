<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Dashboard Prenotazioni | Artyou Roma</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="/js/artyou-booking-config.js"></script>
<style>
:root{--ink:#13181D;--paper:#F6F3EC;--line:#DED7CA;--orange:#F09000;--green:#28B4A8;--red:#C43A4B;--muted:#66717A}
*{box-sizing:border-box}body{margin:0;background:#ECE7DE;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{background:var(--ink);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center;position:sticky;top:0}
header strong{font-size:20px}header small{display:block;color:#BFC8CF;margin-top:3px}header a{color:#fff;text-decoration:none;font-weight:800}
.wrap{max-width:1400px;margin:0 auto;padding:22px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
h1{margin:0 0 5px;font-size:30px}.sub{margin:0;color:var(--muted)}button,.pill{border:0;border-radius:11px;padding:10px 14px;font-weight:800}
button{cursor:pointer;background:var(--ink);color:#fff}.pill{background:#fff;border:1px solid var(--line);color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(20,18,15,.05)}
.stat{padding:18px}.stat span{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:800}.stat b{display:block;font-size:32px;margin-top:6px}
.panel{overflow:hidden}.filters{display:flex;gap:8px;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line)}.filter{background:var(--paper);color:var(--ink);border:1px solid var(--line)}.filter.active{background:var(--orange);border-color:var(--orange)}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:860px}th,td{padding:14px 16px;text-align:left;border-bottom:1px solid #EEE9E1}
th{font-size:12px;text-transform:uppercase;color:var(--muted);background:#FBFAF7}td.num{text-align:right}.event-title{font-weight:900}.date{font-size:13px;color:var(--muted);margin-top:3px}
.bar{height:9px;background:#ECE7DE;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.badge{display:inline-block;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:900}.ok{background:#E7F7F2;color:#12634E}.warn{background:#FFF3D8;color:#855A00}.full{background:#FCE8EC;color:#8A2438}
.empty,.error{padding:26px;text-align:center;color:var(--muted)}.error{color:#8A2438}.mobile-card{display:none}
@media(max-width:760px){.wrap{padding:12px}.topbar{flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.tablewrap{display:none}.mobile-card{display:block;padding:12px}.card{border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}.card-head{display:flex;justify-content:space-between;gap:10px}.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mini{background:var(--paper);border-radius:10px;padding:9px;text-align:center}.mini b{display:block;font-size:20px}.mini span{font-size:10px;color:var(--muted);text-transform:uppercase}}
</style>
</head>
<body>
<header><div><strong>ARTYOU · Prenotazioni Live</strong><small>Dashboard riservata · sola lettura</small></div><a href="/gestionale.html">Gestionale →</a></header>
<main class="wrap">
<div class="topbar"><div><h1>Stato prenotazioni</h1><p class="sub">Aggiornamento automatico ogni 10 secondi.</p></div><div class="actions"><span class="pill" id="updated">Mai aggiornato</span><button id="refresh">Aggiorna ora</button></div></div>
<section class="stats">
<div class="stat"><span>Posti prenotati</span><b id="sBooked">—</b></div>
<div class="stat"><span>Posti disponibili</span><b id="sFree">—</b></div>
<div class="stat"><span>Eventi attivi</span><b id="sEvents">—</b></div>
<div class="stat"><span>Sold out</span><b id="sSold">—</b></div>
</section>
<section class="panel">
<div class="filters" id="filters"><button class="filter active">Tutti</button></div>
<div class="tablewrap"><table><thead><tr><th>Evento</th><th>Capienza</th><th>Prenotati</th><th>Disponibili</th><th>Riempimento</th><th>Stato</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Caricamento…</td></tr></tbody></table></div>
<div class="mobile-card" id="cards"></div>
</section>
</main>
<script>
(function(){
"use strict";
var endpoint=window.ARTYOU_BOOKING_ENDPOINT||"/api/artyou";
var data=[],activeFilter="all";
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function getJSON(url){return fetch(url,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function statusFor(free,cap){if(free<=0)return{label:"Sold out",cls:"full"};if(cap>0&&free/cap<=.2)return{label:"Quasi pieno",cls:"warn"};return{label:"Aperto",cls:"ok"}}
var WORKSHOW_CATALOG=[
  {ids:["tra-fiaba-horror-un-confine-sottile-con-niko-di-felice"],words:["tra fiaba","horror","niko di felice"]},
  {ids:["from-text-to-next-con-federica-forbicioni","from-text-to-next"],words:["from text to next","federica forbicioni"]},
  {ids:["thriller-con-cinzia-zadro","thriller"],words:["thriller","cinzia zadro"]},
  {ids:["laboratorio-avanzati-con-antonio-vulpio","laboratorio-avanzati"],words:["laboratorio avanzati","antonio vulpio","vulpio"]},
  {ids:["human-comedy-con-fabio-mangolini","human-comedy"],words:["human comedy","fabio mangolini","maschera"]},
  {ids:["improv-di-una-notte-di-mezza-primavera-con-pierpaolo-buzza","improv-di-una-notte-di-mezza-primavera"],words:["mezza primavera","shakespeare","pierpaolo buzza"]}
];
function isWorkshow(title,id){
  var iid=String(id||"").toLowerCase();
  var hay=(String(id||"")+" "+String(title||"")).toLowerCase();
  if(hay.indexOf("workshow")>=0)return true;
  for(var i=0;i<WORKSHOW_CATALOG.length;i++){
    var w=WORKSHOW_CATALOG[i];
    if(w.ids.indexOf(iid)>=0)return true;
    for(var j=0;j<w.words.length;j++) if(hay.indexOf(w.words[j])>=0)return true;
  }
  return false;
}
function categoryOf(title,id){
  var t=(String(id||"")+" "+String(title||"")).toLowerCase();
  if(isWorkshow(title,id))return"WorkshoW";
  if(t.indexOf("yep")>=0)return"YEP";
  if(t.indexOf("festival")>=0||t.indexOf("rif")>=0)return"Festival";
  if(t.indexOf("workshop")>=0)return"Workshop";
  return"Spettacoli"
}
function renderFilters(){
  var defs=[
    {id:"all",label:"Tutti"},
    {id:"YEP",label:"YEP"},
    {id:"Spettacoli",label:"Spettacoli"},
    {id:"Festival",label:"Festival"},
    {id:"shortyou",label:"Shortyou"},
    {id:"vortice",label:"Un vortice di Emozioni"},
    {id:"WorkshoW",label:"WorkshoW"}
  ];
  $("filters").innerHTML="";
  defs.forEach(function(d){
    var b=document.createElement("button");
    b.className="filter"+(activeFilter===d.id?" active":"");
    b.textContent=d.label;
    b.onclick=function(){activeFilter=d.id;render()};
    $("filters").appendChild(b);
  });
}
function matchesFilter(x){
  if(activeFilter==="all")return true;
  var hay=(x.id+" "+x.title).toLowerCase();
  if(activeFilter==="shortyou")return hay.indexOf("shortyou")>=0;
  if(activeFilter==="vortice")return hay.indexOf("un vortice")>=0||hay.indexOf("vortice")>=0;
  if(activeFilter==="WorkshoW")return isWorkshow(x.title,x.id);
  return x.category===activeFilter;
}
function render(){
 renderFilters();var list=data.filter(matchesFilter);
 var tb=$("rows"),cards=$("cards");tb.innerHTML="";cards.innerHTML="";
 if(!list.length){tb.innerHTML='<tr><td colspan="6" class="empty">Nessun evento attivo.</td></tr>';cards.innerHTML='<div class="empty">Nessun evento attivo.</div>';return}
 list.forEach(function(x){
   var pct=x.cap>0?Math.round((x.booked/x.cap)*100):0,st=statusFor(x.free,x.cap);
   var tr=document.createElement("tr");
   tr.innerHTML='<td><div class="event-title">'+esc(x.title)+'</div><div class="date">'+esc(x.date)+'</div></td><td class="num">'+x.cap+'</td><td class="num"><b>'+x.booked+'</b></td><td class="num">'+x.free+'</td><td><div class="bar"><i style="width:'+Math.min(100,pct)+'%"></i></div><div class="date">'+pct+'%</div></td><td><span class="badge '+st.cls+'">'+st.label+'</span></td>';
   tb.appendChild(tr);
   var c=document.createElement("div");c.className="card";
   c.innerHTML='<div class="card-head"><div><div class="event-title">'+esc(x.title)+'</div><div class="date">'+esc(x.date)+'</div></div><span class="badge '+st.cls+'">'+st.label+'</span></div><div class="card-grid"><div class="mini"><b>'+x.booked+'</b><span>Prenotati</span></div><div class="mini"><b>'+x.free+'</b><span>Liberi</span></div><div class="mini"><b>'+x.cap+'</b><span>Capienza</span></div></div>';
   cards.appendChild(c);
 });
}
function refresh(){
 Promise.all([getJSON(endpoint+"?eventi=1&_="+Date.now()),getJSON(endpoint+"?disponibilita=1&_="+Date.now())]).then(function(r){
   if(!r[0].ok||!r[1].ok)throw new Error((r[0].errore||r[1].errore||"Errore dati"));
   var events=r[0].eventi||{},free=r[1].disponibilita||{};
   data=Object.keys(events).map(function(id){var e=events[id]||{},cap=Math.max(0,parseInt(e.capienza||0,10)||0),f=Math.max(0,parseInt(free[id]||0,10)||0);return{id:id,title:e.titolo||id,date:e.data||"",cap:cap,free:f,booked:Math.max(0,cap-f),category:categoryOf(e.titolo||id,id)}}).sort(function(a,b){return a.date.localeCompare(b.date)});
   var booked=data.reduce(function(s,x){return s+x.booked},0),available=data.reduce(function(s,x){return s+x.free},0),sold=data.filter(function(x){return x.free<=0}).length;
   $("sBooked").textContent=booked;$("sFree").textContent=available;$("sEvents").textContent=data.length;$("sSold").textContent=sold;
   $("updated").textContent="Aggiornato "+new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
   render();
 }).catch(function(err){$("rows").innerHTML='<tr><td colspan="6" class="error">Impossibile caricare i dati: '+esc(err.message)+'</td></tr>';$("cards").innerHTML='<div class="error">Impossibile caricare i dati.</div>'});
}
$("refresh").onclick=refresh;refresh();setInterval(refresh,10000);
})();
</script>
</body>
</html>
